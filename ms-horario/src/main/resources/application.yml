server:
  port: 8087

spring:
  application:
    name: ms-horario
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/db_horarios?useSSL=false&createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

logging:
  file:
    name: log-horario.log
  level:
    gym.ms_horario: DEBUG
    org.hibernate.SQL: DEBUG
    root: INFO